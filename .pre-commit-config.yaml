# Runs on every commit: hygiene, ruff (lint + format), mypy, and a JWT leak guard.
# Tests are NOT run here (too slow for a commit hook); run pytest manually / in CI.
# Why mypy is a local hook: see docs/decisions.md (D6).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Uses the project venv so mypy sees the real installed deps (playwright, types-requests).
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy spikes
        language: system
        types: [python]
        pass_filenames: false

      # Public repo + live OIDC tokens in .secrets/: refuse anything that looks like a JWT.
      - id: no-jwt
        name: no JWT-looking strings
        entry: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.'
        language: pygrep
