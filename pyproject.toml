[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "0.0.1"
description = "An autonomous Fantasy Premier League manager."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "highspy>=1.7",  # the HiGHS solver for the multi-week transfer plan (D38)
    "numpy>=2.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# The browser login (spikes/phase0_auth.py) runs on your machine only, never in the cloud job.
login = ["playwright>=1.45"]
# Phase 4: the Cloud Run job's Google Cloud services (D36).
cloud = [
    "google-cloud-scheduler>=2.13",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=2.18",
]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
    "types-protobuf",
    "types-requests",
]

[tool.setuptools.packages.find]
include = ["fpl_agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes basics. I: import order. UP: modern syntax. B: likely bugs.
# SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
